name: Select Best Model & Deploy

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  select-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create models directory
        run: mkdir -p models

      # Download artifacts from each branch workflow using GitHub API
      - name: Download artifacts from all branch workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'EOF'
          import subprocess, json, os, sys

          repo  = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]

          # artifact name → destination path
          targets = {
              "model-combined":  "models",
              "model-mfcc-only": "models",
              "model-zcr-others":"models",
          }

          def gh(url):
              r = subprocess.run(
                  ["curl", "-sf", "-H", f"Authorization: Bearer {token}",
                   "-H", "Accept: application/vnd.github+json",
                   f"https://api.github.com/{url}"],
                  capture_output=True, text=True
              )
              return json.loads(r.stdout) if r.stdout else {}

          # get all artifacts for this repo
          data = gh(f"repos/{repo}/actions/artifacts?per_page=100")
          artifacts = data.get("artifacts", [])
          print(f"Found {len(artifacts)} artifacts in repo")

          for art in artifacts:
              name = art["name"]
              if name not in targets or art["expired"]:
                  continue
              dest = targets[name]
              art_id = art["id"]
              print(f"Downloading {name} (id={art_id}) → {dest}/")
              os.makedirs(dest, exist_ok=True)
              subprocess.run([
                  "curl", "-sL",
                  "-H", f"Authorization: Bearer {token}",
                  "-H", "Accept: application/vnd.github+json",
                  f"https://api.github.com/repos/{repo}/actions/artifacts/{art_id}/zip",
                  "-o", f"/tmp/{name}.zip"
              ], check=True)
              subprocess.run(["unzip", "-o", f"/tmp/{name}.zip", "-d", dest], check=True)
              del targets[name]   # mark as downloaded

          if targets:
              print(f"WARNING: could not find artifacts for: {list(targets.keys())}")
          else:
              print("All artifacts downloaded successfully!")
          EOF

      - name: List downloaded models
        run: ls -la models/

      - name: Run model selection
        env:
          MLFLOW_TRACKING_URI: "file:///tmp/mlflow"
          MODEL_OUT_DIR: models
        run: python model_selector.py

      - name: Verify active model
        run: |
          echo "=== Active model meta ==="
          cat models/active/meta.json

      - name: Upload active model artifact
        uses: actions/upload-artifact@v4
        with:
          name: active-model
          path: models/active/
          retention-days: 90

      # ── Docker build & push ───────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mlops-vad:latest
            ghcr.io/${{ github.repository_owner }}/mlops-vad:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
