name: Select Best Model & Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  workflow_run:
    workflows:
      - "Train – Combined Features"
      - "Train – MFCC Only"
      - "Train – ZCR Others"
    types: [completed]

env:
  PYTHON_VERSION: "3.11"
  MODEL_OUT_DIR: models

jobs:
  select-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download artifacts from all branch workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'EOF'
          import subprocess, json, os

          repo  = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]

          targets = {
              "model-combined":   "models",
              "model-mfcc-only":  "models",
              "model-zcr-others": "models",
          }

          def gh(url):
              r = subprocess.run(
                  ["curl", "-sf", "-H", f"Authorization: Bearer {token}",
                   "-H", "Accept: application/vnd.github+json",
                   f"https://api.github.com/{url}"],
                  capture_output=True, text=True
              )
              return json.loads(r.stdout) if r.stdout else {}

          data = gh(f"repos/{repo}/actions/artifacts?per_page=100")
          artifacts = data.get("artifacts", [])
          print(f"Found {len(artifacts)} artifacts in repo")

          # Pick the MOST RECENT non-expired artifact per name
          latest = {}
          for art in artifacts:
              name = art["name"]
              if name not in targets or art["expired"]:
                  continue
              existing = latest.get(name)
              if not existing or art["id"] > existing["id"]:
                  latest[name] = art

          missing = set(targets.keys()) - set(latest.keys())
          if missing:
              print(f"WARNING: could not find artifacts for: {list(missing)}")

          for name, art in latest.items():
              dest = targets[name]
              os.makedirs(dest, exist_ok=True)
              print(f"Downloading {name} (id={art['id']}) to {dest}/")
              subprocess.run([
                  "curl", "-sL",
                  "-H", f"Authorization: Bearer {token}",
                  "-H", "Accept: application/vnd.github+json",
                  f"https://api.github.com/repos/{repo}/actions/artifacts/{art['id']}/zip",
                  "-o", f"/tmp/{name}.zip"
              ], check=True)
              subprocess.run(["unzip", "-o", f"/tmp/{name}.zip", "-d", dest], check=True)

          if not missing:
              print("All artifacts downloaded successfully!")
          EOF

      - name: List downloaded models
        run: |
          echo "=== Models directory ==="
          ls -la models/ || echo "(empty)"
          echo "=== Meta files ==="
          find models/ -name "meta_*.json" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null || echo "No meta files"

      - name: Configure MLflow
        run: |
          mkdir -p /tmp/mlflow
          URI="${MLFLOW_TRACKING_URI_SECRET:-file:///tmp/mlflow}"
          echo "MLFLOW_URI=$URI" >> $GITHUB_ENV
          echo "Using MLflow URI: $URI"
        env:
          MLFLOW_TRACKING_URI_SECRET: ${{ secrets.MLFLOW_TRACKING_URI }}

      - name: Run model selection
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_URI }}
          MODEL_OUT_DIR: ${{ env.MODEL_OUT_DIR }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: python model_selector.py

      - name: Verify active model
        run: |
          echo "=== Active model meta ==="
          python -m json.tool models/active/meta.json

      - name: Upload MLflow tracking DB (file-based)
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-tracking-db-${{ github.run_number }}
          path: /tmp/mlflow/
          retention-days: 30
        continue-on-error: true

      - name: Upload active model artifact
        uses: actions/upload-artifact@v4
        with:
          name: active-model
          path: models/active/
          retention-days: 90

      - name: Commit updated active model
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add models/active/
          if ! git diff --staged --quiet; then
            git commit -m "🤖 CI: update active model [$(date -u '+%Y-%m-%d %H:%M:%S UTC')]"
            git push
            echo "Active model committed to repo"
          else
            echo "Active model unchanged, no commit needed"
          fi
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mlops-vad:latest
            ghcr.io/${{ github.repository_owner }}/mlops-vad:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write job summary
        run: |
          echo "## Model Selection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          python -m json.tool models/active/meta.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        continue-on-error: true
