services:
  # MLflow tracking server
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: vad-mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      # The MLflow image does not ship with curl.
      # Use Python (always present) to probe the /health endpoint instead.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request, sys; urllib.request.urlopen('http://localhost:5000/health'); sys.exit(0)"
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s   # give MLflow time to initialize the SQLite DB
    restart: unless-stopped
    networks:
      - vad-network

  # VAD API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vad-api
    ports:
      - "8000:8000"
    environment:
      - ACTIVE_MODEL_DIR=/app/models/active
      - MODEL_OUT_DIR=/app/models
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - FEEDBACK_THRESHOLD=50
    volumes:
      - ./models:/app/models
      - ./feedback_data.csv:/app/feedback_data.csv
      - ./prediction_log.csv:/app/prediction_log.csv
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vad-network
    healthcheck:
      # curl IS available in the API image (installed in Dockerfile)
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Training runner (one-shot, exits after training)
  # Run with: docker compose run --rm trainer
  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vad-trainer
    entrypoint: []
    command: >
      sh -c "
        echo 'Training all 3 feature sets...' &&
        FEATURE_SET=combined       python train.py &&
        FEATURE_SET=mfcc_only      python train.py &&
        FEATURE_SET=zcr_others     python train.py &&
        python model_selector.py &&
        echo 'Done!'
      "
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DATASET_PATH=balanced_vad_dataset.csv
      - MODEL_OUT_DIR=models
    volumes:
      - ./models:/app/models
      - ./balanced_vad_dataset.csv:/app/balanced_vad_dataset.csv
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - vad-network
    profiles:
      - training

  # Model auto-updater service
  # Run with: docker compose run --rm auto-updater
  auto-updater:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vad-auto-updater
    entrypoint: []
    command: >
      sh -c "
        echo 'Checking for feedback and retraining if needed...' &&
        python -c '
        import os
        import pandas as pd
        threshold = int(os.getenv(\"FEEDBACK_THRESHOLD\", \"50\"))
        if os.path.exists(\"feedback_data.csv\"):
            df = pd.read_csv(\"feedback_data.csv\")
            count = len(df)
            print(f\"Feedback samples: {count}\")
            if count >= threshold:
                print(\"Threshold reached! Retraining...\")
                exit(0)
            else:
                print(f\"Need {threshold - count} more samples\")
                exit(1)
        else:
            print(\"No feedback data found\")
            exit(1)
        ' &&
        echo 'Retraining all models with feedback...' &&
        python -c '
        import pandas as pd
        import os
        if os.path.exists(\"feedback_data.csv\"):
            original = pd.read_csv(\"balanced_vad_dataset.csv\")
            feedback = pd.read_csv(\"feedback_data.csv\")
            merged = pd.concat([original, feedback]).drop_duplicates()
            merged.to_csv(\"balanced_vad_dataset.csv\", index=False)
            print(f\"Merged dataset: {len(merged)} samples\")
        ' &&
        FEATURE_SET=combined       python train.py &&
        FEATURE_SET=mfcc_only      python train.py &&
        FEATURE_SET=zcr_others     python train.py &&
        python model_selector.py &&
        echo 'Model update complete!'
      "
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DATASET_PATH=balanced_vad_dataset.csv
      - MODEL_OUT_DIR=models
      - FEEDBACK_THRESHOLD=50
    volumes:
      - ./models:/app/models
      - ./balanced_vad_dataset.csv:/app/balanced_vad_dataset.csv
      - ./feedback_data.csv:/app/feedback_data.csv
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - vad-network
    profiles:
      - auto-update

volumes:
  mlflow-data:
    driver: local

networks:
  vad-network:
    driver: bridge
