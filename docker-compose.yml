services:

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow-server
    command: mlflow ui --host 0.0.0.0 --port 5000
    ports:
      - "5001:5000"
    volumes:
      - mlflow_data:/mlruns

  trainer:
    build: .
    container_name: vad-trainer
    command: sh -c "while true; do python mlflow_pipeline/train_branches.py; echo 'Retraining...'; sleep 60; done"
    volumes:
      - .:/app
      - mlflow_data:/mlruns
    env_file:
      - .env
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000

  api:
    build: .
    container_name: vad-api
    depends_on:
      - trainer
      - mlflow
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8080:8000"
    volumes:
      - .:/app
      - mlflow_data:/mlruns
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000

volumes:
  mlflow_data: