services:

  trainer:
    build: .
    container_name: vad-trainer
    command: sh -c "while true; do python mlflow_pipeline/train_branches.py; echo 'Retraining...'; sleep 60; done"
    volumes:
      - .:/app
      - mlflow_data:/mlruns
    env_file:
      - .env

  api:
    build: .
    container_name: vad-api
    depends_on:
      - trainer
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8080:8000"
    volumes:
      - .:/app
      - mlflow_data:/mlruns

volumes:
  mlflow_data: