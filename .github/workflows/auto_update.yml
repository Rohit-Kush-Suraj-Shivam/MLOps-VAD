name: Auto Model Update - Feedback Based Retraining

on:
  # Trigger when feedback data reaches threshold
  workflow_dispatch:
    inputs:
      force_retrain:
        description: 'Force retraining regardless of feedback count'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      feedback_threshold:
        description: 'Minimum feedback samples to trigger retraining'
        required: false
        default: '50'
        type: string
  
  # Scheduled check for feedback data (runs every 6 hours)
  schedule:
    - cron: '0 */6 * * *'
  
  # Trigger when feedback file is updated
  push:
    paths:
      - 'feedback_data.csv'
      - 'models/feedback/**'

env:
  PYTHON_VERSION: "3.11"
  MODEL_OUT_DIR: models
  MLFLOW_TRACKING_URI: "file:///tmp/mlflow"
  FEEDBACK_THRESHOLD: ${{ github.event.inputs.feedback_threshold || '50' }}

jobs:
  # ============================================================================
  # Check if retraining is needed
  # ============================================================================
  check-feedback:
    runs-on: ubuntu-latest
    outputs:
      should_retrain: ${{ steps.check.outputs.should_retrain }}
      feedback_count: ${{ steps.check.outputs.feedback_count }}
      current_f1: ${{ steps.check.outputs.current_f1 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Feedback Data
        id: check
        run: |
          python3 << 'EOF'
          import json
          import os
          
          FEEDBACK_FILE = 'feedback_data.csv'
          THRESHOLD = int(os.getenv('FEEDBACK_THRESHOLD', '50'))
          
          feedback_count = 0
          if os.path.exists(FEEDBACK_FILE):
              with open(FEEDBACK_FILE, 'r') as f:
                  # Count lines minus header
                  lines = f.readlines()
                  feedback_count = max(0, len(lines) - 1)
          
          # Get current model F1 score
          current_f1 = 0.0
          if os.path.exists('models/active/meta.json'):
              with open('models/active/meta.json', 'r') as f:
                  meta = json.load(f)
                  current_f1 = meta.get('metrics', {}).get('f1', 0.0)
          
          # Decide if retraining is needed
          should_retrain = feedback_count >= THRESHOLD
          
          # Force retrain if requested
          if os.getenv('FORCE_RETRAIN') == 'true':
              should_retrain = True
              print("⚠️ Forced retraining enabled")
          
          print(f"Feedback samples: {feedback_count}")
          print(f"Threshold: {THRESHOLD}")
          print(f"Current F1: {current_f1:.4f}")
          print(f"Should retrain: {should_retrain}")
          
          # Set outputs
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"should_retrain={str(should_retrain).lower()}\n")
              f.write(f"feedback_count={feedback_count}\n")
              f.write(f"current_f1={current_f1:.4f}\n")
          EOF
        env:
          FORCE_RETRAIN: ${{ github.event.inputs.force_retrain || 'false' }}

  # ============================================================================
  # Retrain models if needed
  # ============================================================================
  retrain-models:
    runs-on: ubuntu-latest
    needs: check-feedback
    if: needs.check-feedback.outputs.should_retrain == 'true'
    timeout-minutes: 60
    strategy:
      matrix:
        feature_set: [combined, mfcc_only, zcr_others]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup MLflow
        run: |
          mkdir -p /tmp/mlflow
          echo "MLflow tracking URI: ${{ env.MLFLOW_TRACKING_URI }}"

      - name: Merge Feedback into Training Data
        run: |
          python3 << 'EOF'
          import pandas as pd
          import os
          
          # Load original training data
          original_data = pd.read_csv('balanced_vad_dataset.csv')
          print(f"Original data: {len(original_data)} samples")
          
          # Load feedback data if exists
          if os.path.exists('feedback_data.csv'):
              feedback_data = pd.read_csv('feedback_data.csv')
              print(f"Feedback data: {len(feedback_data)} samples")
              
              # Merge datasets
              merged = pd.concat([original_data, feedback_data], ignore_index=True)
              
              # Remove duplicates if any
              merged = merged.drop_duplicates()
              
              # Save merged dataset
              merged.to_csv('balanced_vad_dataset.csv', index=False)
              print(f"Merged data: {len(merged)} samples")
          else:
              print("No feedback data found, using original dataset")
          EOF

      - name: Train Model with Feedback
        env:
          FEATURE_SET: ${{ matrix.feature_set }}
          DATASET_PATH: balanced_vad_dataset.csv
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
          MODEL_OUT_DIR: models
        run: python train.py

      - name: Upload Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ matrix.feature_set }}-updated
          path: |
            models/model_${{ matrix.feature_set }}.pkl
            models/scaler_${{ matrix.feature_set }}.pkl
            models/meta_${{ matrix.feature_set }}.json
          retention-days: 30

  # ============================================================================
  # Select best model and deploy
  # ============================================================================
  select-and-deploy:
    runs-on: ubuntu-latest
    needs: retrain-models
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download All Updated Models
        uses: actions/download-artifact@v4
        with:
          path: models/
          pattern: model-*-updated
          merge-multiple: true

      - name: List Models
        run: |
          echo "=== Updated Models ==="
          ls -la models/
          find models/ -name "*.json" -exec echo "Meta: {}" \; -exec cat {} \;

      - name: Run Model Selection
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
          MODEL_OUT_DIR: models
        run: python model_selector.py

      - name: Verify Active Model
        run: |
          echo "=== New Active Model ==="
          cat models/active/meta.json | python -m json.tool

      - name: Clear Processed Feedback
        run: |
          # Archive processed feedback
          if [ -f feedback_data.csv ]; then
            mv feedback_data.csv "feedback_data_processed_$(date +%Y%m%d_%H%M%S).csv"
            echo "Feedback data archived"
          fi
          
          # Create empty feedback file
          echo "label,mfcc_1,mfcc_2,mfcc_3,mfcc_4,mfcc_5,mfcc_6,mfcc_7,mfcc_8,mfcc_9,mfcc_10,mfcc_11,mfcc_12,mfcc_13,energy,zcr,spectral_centroid,timestamp,source" > feedback_data.csv
          echo "Feedback data cleared for next iteration"

      - name: Commit Updated Models
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add models/active/
          git add feedback_data.csv
          
          if ! git diff --staged --quiet; then
            git commit -m "🔄 Auto-update: Retrained models with feedback [$(date -u '+%Y-%m-%d %H:%M:%S UTC')]"
            git push
            echo "✅ Updated models committed"
          fi
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vad-mlops:latest
            ghcr.io/${{ github.repository_owner }}/vad-mlops:updated-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: auto-update-v${{ github.run_number }}
          name: Auto-Update v${{ github.run_number }} (Feedback-Based)
          body: |
            ## 🔄 Automated Model Update
            
            This release contains models retrained with user feedback data.
            
            **Update Details:**
            - Feedback samples used: ${{ needs.check-feedback.outputs.feedback_count }}
            - Previous F1: ${{ needs.check-feedback.outputs.current_f1 }}
            - New F1: See meta.json for updated metrics
            
            **Changes:**
            - Models retrained with merged feedback data
            - Best model selected from all feature sets
            
            **Docker Image:**
            - `ghcr.io/${{ github.repository_owner }}/vad-mlops:latest`
          files: |
            models/active/*.pkl
            models/active/*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Update Summary
        run: |
          echo "## 🔄 Auto-Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Feedback Samples | ${{ needs.check-feedback.outputs.feedback_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Previous F1 | ${{ needs.check-feedback.outputs.current_f1 }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Updated Model Info:" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat models/active/meta.json >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
