name: MLOps Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ✅ Ensure model exists
      - name: Create dummy model
        run: |
          mkdir -p models/active
          python -c "import joblib; from sklearn.ensemble import RandomForestClassifier; m=RandomForestClassifier(); m.n_features_in_=10; joblib.dump(m, 'models/active/model.pkl')"

      # 🚨 DEBUG MODE — RUN UVICORN IN FOREGROUND
      - name: Start API (DEBUG MODE)
        run: |
          python -m uvicorn api.main:app --host 127.0.0.1 --port 8000