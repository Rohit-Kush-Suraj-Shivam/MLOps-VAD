name: MLOps Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ✅ Fix PYTHONPATH (CRITICAL)
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      # ✅ Create dummy model
      - name: Create dummy model
        run: |
          mkdir -p models/active
          python -c "import joblib; from sklearn.ensemble import RandomForestClassifier; m=RandomForestClassifier(); m.n_features_in_=10; joblib.dump(m, 'models/active/model.pkl')"

      # ✅ Start API (FIXED IMPORT)
      - name: Start API
        run: |
          nohup python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          sleep 5

      # ✅ Show logs (THIS WILL SHOW REAL ERROR)
      - name: Show logs
        run: cat server.log || true

      # ✅ Wait for API
      - name: Wait for API
        run: |
          for i in {1..20}; do
            if curl -s http://127.0.0.1:8000/health; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting..."
            sleep 2
          done
          echo "API failed"
          exit 1

      - name: Test API
        run: curl http://127.0.0.1:8000