name: MLOps Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:

  train:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.10

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Train model
      run: python mlflow_pipeline/train_branches.py

    - name: Upload model artifacts
      uses: actions/upload-artifact@v4
      with:
        name: model
        path: models/

  api-test:
    runs-on: ubuntu-latest
    needs: train

    steps:
    - uses: actions/checkout@v3

    - name: Download model
      uses: actions/download-artifact@v4
      with:
        name: model

    - name: Ensure model path
      run: mkdir -p models/active

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.10

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Start API
      run: |
        uvicorn api.main:app &

    - name: Wait for API
      run: |
        for i in {1..10}; do
          curl -s http://localhost:8000/health && break
          sleep 2
        done

    - name: Test API
      run: curl http://localhost:8000

  docker:
    runs-on: ubuntu-latest
    needs: api-test

    steps:
    - uses: actions/checkout@v3

    - name: Login to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build Docker image
      run: docker build -t ghcr.io/${{ github.repository_owner }}/vad-app:latest .

    - name: Push Docker image
      run: docker push ghcr.io/${{ github.repository_owner }}/vad-app:latest

  build-exe:
    runs-on: windows-latest
    needs: api-test

    steps:
    - uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.10

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Install PyInstaller
      run: pip install pyinstaller

    - name: Build EXE
      run: pyinstaller vad_app.spec --clean

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: exe
        path: dist/VAD-App.exe