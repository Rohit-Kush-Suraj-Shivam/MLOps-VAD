name: MLOps Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model
        run: python mlflow_pipeline/train_branches.py


  api-test:
    runs-on: ubuntu-latest
    needs: train

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure model exists
        run: |
          mkdir -p models/active
          python - <<EOF
          import joblib
          from sklearn.ensemble import RandomForestClassifier
          joblib.dump(RandomForestClassifier(), "models/active/model.pkl")
          EOF

      - name: Start API
        run: |
          nohup uvicorn api.main:app --host 127.0.0.1 --port 8080 > server.log 2>&1 &
          sleep 5

      - name: Show server logs
        run: cat server.log || true

      - name: Wait for API
        run: |
          for i in {1..20}; do
            if curl -s http://127.0.0.1:8080/health; then
              echo "API is up!"
              break
            fi
            echo "Waiting for API..."
            sleep 2
          done

      - name: Test API
        run: curl http://127.0.0.1:8080


  docker:
    runs-on: ubuntu-latest
    needs: api-test

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -t ghcr.io/$OWNER_LC/vad-app:latest .

      - name: Push Docker image
        run: docker push ghcr.io/$OWNER_LC/vad-app:latest


  build-exe:
    runs-on: windows-latest
    needs: api-test

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller vad_app.spec --clean

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/