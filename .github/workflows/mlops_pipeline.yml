name: MLOps Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:

  api-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - run: pip install -r requirements.txt

      # ✅ ensure model exists
      - name: Create dummy model
        run: |
          mkdir -p models/active
          python - <<EOF
import joblib
from sklearn.ensemble import RandomForestClassifier
model = RandomForestClassifier()
model.n_features_in_ = 10
joblib.dump(model, "models/active/model.pkl")
EOF

      # ✅ start API
      - name: Start API
        run: |
          nohup uvicorn api.main:app --host 127.0.0.1 --port 8080 > server.log 2>&1 &
          sleep 5

      # ✅ show logs
      - name: Debug logs
        run: cat server.log || true

      # ✅ wait properly
      - name: Wait for API
        run: |
          for i in {1..20}; do
            if curl -s http://127.0.0.1:8080/health; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting..."
            sleep 2
          done
          echo "API failed to start"
          exit 1

      - name: Test API
        run: curl http://127.0.0.1:8080