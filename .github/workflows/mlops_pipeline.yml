name: MLOps Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  train:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - run: pip install -r requirements.txt

    - run: python mlflow_pipeline/train_branches.py

  api-test:
    runs-on: ubuntu-latest
    needs: train

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - run: pip install -r requirements.txt

    # ✅ START API ON 8080
    - name: Start API
      run: |
        nohup uvicorn api.main:app --host 127.0.0.1 --port 8080 > server.log 2>&1 &

    # ✅ WAIT FOR API
    - name: Wait for API
      run: |
        for i in {1..15}; do
          curl -s http://127.0.0.1:8080 && break
          echo "Waiting for API..."
          sleep 2
        done

    # ✅ TEST API
    - name: Test API
      run: curl http://127.0.0.1:8080

  docker:
    runs-on: ubuntu-latest
    needs: api-test

    steps:
    - uses: actions/checkout@v3

    - run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

    - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - run: docker build -t ghcr.io/$OWNER_LC/vad-app:latest .

    - run: docker push ghcr.io/$OWNER_LC/vad-app:latest

  build-exe:
    runs-on: windows-latest
    needs: api-test

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - run: pip install -r requirements.txt

    - run: pip install pyinstaller

    - run: pyinstaller vad_app.spec --clean

    - uses: actions/upload-artifact@v4
      with:
        name: exe
        path: dist/