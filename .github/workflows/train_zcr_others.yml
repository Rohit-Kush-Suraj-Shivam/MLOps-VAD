name: Train – ZCR & Others

on:
  push:
    branches: [ "feature/zcr-others" ]
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start MLflow server (local, background)
        run: |
          pip install mlflow
          mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db &
          sleep 5

      - name: Train ZCR+others model
        env:
          FEATURE_SET: zcr_others
          MLFLOW_TRACKING_URI: http://localhost:5000
          DATASET_PATH: balanced_vad_dataset.csv
          MODEL_OUT_DIR: models
        run: python train.py

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-zcr-others
          path: |
            models/model_zcr_others.pkl
            models/scaler_zcr_others.pkl
            models/meta_zcr_others.json
          retention-days: 30

      - name: Upload MLflow DB
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-db-zcr-others
          path: mlflow.db
          retention-days: 7
