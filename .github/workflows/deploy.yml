name: Select Best Model & Deploy

on:
  # Trigger when any branch model artifact is updated via manual dispatch
  workflow_dispatch:
  # Or trigger on push to main (after merging)
  push:
    branches: [ "main" ]

jobs:
  select-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Download artifacts from all 3 branch workflows
      - name: Download combined model
        uses: actions/download-artifact@v4
        with:
          name: model-combined
          path: models/
        continue-on-error: true

      - name: Download mfcc-only model
        uses: actions/download-artifact@v4
        with:
          name: model-mfcc-only
          path: models/
        continue-on-error: true

      - name: Download zcr-others model
        uses: actions/download-artifact@v4
        with:
          name: model-zcr-others
          path: models/
        continue-on-error: true

      - name: List available models
        run: ls -la models/ || echo "No models dir yet"

      - name: Run model selection
        env:
          MLFLOW_TRACKING_URI: "file:///tmp/mlflow"
          MODEL_OUT_DIR: models
        run: python model_selector.py

      - name: Verify active model
        run: |
          echo "=== Active model meta ==="
          cat models/active/meta.json

      - name: Upload active model artifact
        uses: actions/upload-artifact@v4
        with:
          name: active-model
          path: models/active/
          retention-days: 90

      # ── Docker build & push ───────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vad-mlops:latest
            ghcr.io/${{ github.repository_owner }}/vad-mlops:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
