name: CI - Tests & Linting

on:
  push:
    branches: ["main", "feature/*"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 black

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check formatting with black
        run: black --check . || true

      - name: Run tests
        run: |
          pytest tests/ -v --cov=. --cov-report=xml || echo "No tests found"
        continue-on-error: true

      - name: Test model loading
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from api.main import load_active
          try:
              model, scaler, meta = load_active()
              print('✅ Model loaded successfully')
              print(f'Model type: {meta.get(\"model_type\", \"unknown\")}')
          except Exception as e:
              print(f'⚠️  Could not load model: {e}')
              print('This is expected if no model has been trained yet.')
          "
        continue-on-error: true

      - name: Test imports
        run: |
          python -c "
          import train
          import model_selector
          print('✅ All imports successful')
          "

  build-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: vad-mlops:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run -d --name vad-test -p 8000:8000 vad-mlops:test
          sleep 10
          docker logs vad-test
          curl -f http://localhost:8000/health || echo "Health check may fail without model"
          docker stop vad-test
          docker rm vad-test
        continue-on-error: true
