name: Unified ML Pipeline - Train, Select & Deploy

on:
  push:
    branches: ["main", "feature/combined", "feature/mfcc-only", "feature/zcr-others"]
  workflow_dispatch:
    inputs:
      skip_training:
        description: 'Skip training and use existing models'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  PYTHON_VERSION: "3.11"
  MODEL_OUT_DIR: models
  MLFLOW_TRACKING_URI: "file:///tmp/mlflow"

jobs:
  # ============================================================================
  # JOB 1: Train all three feature set models in parallel
  # ============================================================================
  train-combined:
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_training != 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup MLflow
        run: |
          mkdir -p /tmp/mlflow
          echo "MLflow tracking URI: ${{ env.MLFLOW_TRACKING_URI }}"

      - name: Train Combined Model
        env:
          FEATURE_SET: combined
          DATASET_PATH: balanced_vad_dataset.csv
        run: python train.py

      - name: Upload Combined Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-combined
          path: |
            models/model_combined.pkl
            models/scaler_combined.pkl
            models/meta_combined.json
          retention-days: 30

  train-mfcc-only:
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_training != 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup MLflow
        run: mkdir -p /tmp/mlflow

      - name: Train MFCC-Only Model
        env:
          FEATURE_SET: mfcc_only
          DATASET_PATH: balanced_vad_dataset.csv
        run: python train.py

      - name: Upload MFCC-Only Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-mfcc-only
          path: |
            models/model_mfcc_only.pkl
            models/scaler_mfcc_only.pkl
            models/meta_mfcc_only.json
          retention-days: 30

  train-zcr-others:
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_training != 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup MLflow
        run: mkdir -p /tmp/mlflow

      - name: Train ZCR-Others Model
        env:
          FEATURE_SET: zcr_others
          DATASET_PATH: balanced_vad_dataset.csv
        run: python train.py

      - name: Upload ZCR-Others Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-zcr-others
          path: |
            models/model_zcr_others.pkl
            models/scaler_zcr_others.pkl
            models/meta_zcr_others.json
          retention-days: 30

  # ============================================================================
  # JOB 2: Select Best Model & Deploy (depends on all training jobs)
  # ============================================================================
  select-and-deploy:
    runs-on: ubuntu-latest
    needs: [train-combined, train-mfcc-only, train-zcr-others]
    if: always() && (needs.train-combined.result == 'success' || github.event.inputs.skip_training == 'true')
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Download all model artifacts from training jobs
      - name: Download Combined Model
        uses: actions/download-artifact@v4
        with:
          name: model-combined
          path: models/
        continue-on-error: true

      - name: Download MFCC-Only Model
        uses: actions/download-artifact@v4
        with:
          name: model-mfcc-only
          path: models/
        continue-on-error: true

      - name: Download ZCR-Others Model
        uses: actions/download-artifact@v4
        with:
          name: model-zcr-others
          path: models/
        continue-on-error: true

      - name: List Downloaded Models
        run: |
          echo "=== Downloaded Models ==="
          ls -la models/ || echo "No models directory"
          find models/ -name "*.json" -exec echo "Meta: {}" \;

      # Run model selection to pick the best model
      - name: Run Model Selection
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
          MODEL_OUT_DIR: models
        run: python model_selector.py

      - name: Verify Active Model
        run: |
          echo "=== Active Model Metadata ==="
          cat models/active/meta.json || echo "No meta.json found"
          echo ""
          echo "=== Active Model Files ==="
          ls -la models/active/

      # Upload the selected active model as artifact
      - name: Upload Active Model
        uses: actions/upload-artifact@v4
        with:
          name: active-model
          path: models/active/
          retention-days: 90

      # Commit the active model back to repository for persistence
      - name: Commit Active Model to Repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Create models/active directory if not exists
          mkdir -p models/active
          
          # Check if there are changes
          if [ -n "$(git status --porcelain models/active/)" ]; then
            git add models/active/
            git commit -m "🤖 Auto-update: Deploy best model [$(date -u '+%Y-%m-%d %H:%M:%S UTC')]"
            git push
            echo "✅ Models committed to repository"
          else
            echo "ℹ️ No model changes to commit"
          fi
        continue-on-error: true

      # Build and push Docker image
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vad-mlops:latest
            ghcr.io/${{ github.repository_owner }}/vad-mlops:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/vad-mlops:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Create GitHub Release with model artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: model-v${{ github.run_number }}
          name: Model Release v${{ github.run_number }}
          body: |
            Automated model release
            - Run Number: ${{ github.run_number }}
            - Commit: ${{ github.sha }}
            - Best model selected from all feature sets
          files: |
            models/active/*.pkl
            models/active/*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ============================================================================
  # JOB 3: Run Tests on Deployed Model
  # ============================================================================
  test-deployment:
    runs-on: ubuntu-latest
    needs: select-and-deploy
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download Active Model
        uses: actions/download-artifact@v4
        with:
          name: active-model
          path: models/active/

      - name: Run API Tests
        run: |
          # Start API in background
          python -c "
          import sys
          sys.path.insert(0, '.')
          from api.main import app
          import uvicorn
          uvicorn.run(app, host='0.0.0.0', port=8000)
          " &
          sleep 5
          
          # Test health endpoint
          curl -f http://localhost:8000/health || exit 1
          
          # Test model info endpoint
          curl -f http://localhost:8000/model-info || exit 1
          
          echo "✅ All tests passed"
