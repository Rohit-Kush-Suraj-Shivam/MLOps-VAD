name: Select Best Model & Deploy

on:
  # Manual trigger with options
  workflow_dispatch:
    inputs:
      use_artifacts:
        description: 'Download models from artifacts (if available)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      use_releases:
        description: 'Download models from latest release'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  # Trigger on push to main
  push:
    branches: ["main"]
  # Trigger after training workflows complete
  workflow_run:
    workflows: ["Train – Combined Features", "Train – MFCC Only", "Train – ZCR Others"]
    types:
      - completed
    branches: ["main"]

env:
  PYTHON_VERSION: "3.11"
  MODEL_OUT_DIR: models
  MLFLOW_TRACKING_URI: "file:///tmp/mlflow"

jobs:
  select-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ==========================================================================
      # OPTION 1: Try to download from artifacts (from recent training runs)
      # ==========================================================================
      - name: Download Combined Model from Artifacts
        if: github.event.inputs.use_artifacts != 'false'
        uses: actions/download-artifact@v4
        with:
          name: model-combined
          path: models/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Download MFCC-Only Model from Artifacts
        if: github.event.inputs.use_artifacts != 'false'
        uses: actions/download-artifact@v4
        with:
          name: model-mfcc-only
          path: models/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Download ZCR-Others Model from Artifacts
        if: github.event.inputs.use_artifacts != 'false'
        uses: actions/download-artifact@v4
        with:
          name: model-zcr-others
          path: models/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      # ==========================================================================
      # OPTION 2: Download from latest release (persistent storage)
      # ==========================================================================
      - name: Download Models from Latest Release
        if: github.event.inputs.use_releases == 'true'
        run: |
          # Get latest release assets
          LATEST_RELEASE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" | \
            jq -r '.tag_name // empty')
          
          if [ -n "$LATEST_RELEASE" ]; then
            echo "Downloading models from release: $LATEST_RELEASE"
            mkdir -p models/active
            
            # Download release assets
            curl -sL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://github.com/${{ github.repository }}/releases/download/$LATEST_RELEASE/model.pkl" \
              -o models/active/model.pkl || echo "model.pkl not found in release"
            
            curl -sL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://github.com/${{ github.repository }}/releases/download/$LATEST_RELEASE/scaler.pkl" \
              -o models/active/scaler.pkl || echo "scaler.pkl not found in release"
            
            curl -sL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://github.com/${{ github.repository }}/releases/download/$LATEST_RELEASE/meta.json" \
              -o models/active/meta.json || echo "meta.json not found in release"
          else
            echo "No releases found"
          fi
        continue-on-error: true

      # ==========================================================================
      # OPTION 3: Use existing models from repository
      # ==========================================================================
      - name: Check for Existing Models
        run: |
          echo "=== Checking for Available Models ==="
          
          # List all model files
          find models/ -name "*.pkl" -o -name "*.json" 2>/dev/null | head -20
          
          # Check if we have individual branch models
          for branch in combined mfcc_only zcr_others; do
            if [ -f "models/model_${branch}.pkl" ]; then
              echo "✅ Found model_${branch}.pkl"
            else
              echo "❌ Missing model_${branch}.pkl"
            fi
            
            if [ -f "models/meta_${branch}.json" ]; then
              echo "✅ Found meta_${branch}.json"
            else
              echo "❌ Missing meta_${branch}.json"
            fi
          done
          
          # Check if we already have an active model
          if [ -f "models/active/model.pkl" ]; then
            echo "✅ Active model exists"
            cat models/active/meta.json 2>/dev/null || echo "No meta.json for active model"
          else
            echo "❌ No active model found"
          fi

      # ==========================================================================
      # Run Model Selection
      # ==========================================================================
      - name: Run Model Selection
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
          MODEL_OUT_DIR: models
        run: |
          # Check if we have any models to select from
          MODEL_COUNT=$(find models/ -name "model_*.pkl" 2>/dev/null | wc -l)
          
          if [ "$MODEL_COUNT" -eq 0 ] && [ ! -f "models/active/model.pkl" ]; then
            echo "❌ No models available. Please run training first."
            exit 1
          fi
          
          # Run model selector
          python model_selector.py

      - name: Verify Active Model
        run: |
          echo "=== Active Model Metadata ==="
          if [ -f "models/active/meta.json" ]; then
            cat models/active/meta.json | python -m json.tool
          else
            echo "❌ No meta.json found"
            exit 1
          fi
          
          echo ""
          echo "=== Active Model Files ==="
          ls -la models/active/

      # ==========================================================================
      # Upload Active Model as Artifact
      # ==========================================================================
      - name: Upload Active Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: active-model
          path: models/active/
          retention-days: 90

      # ==========================================================================
      # Commit Active Model to Repository
      # ==========================================================================
      - name: Commit Active Model to Repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Ensure models/active directory exists
          mkdir -p models/active
          
          # Stage the active model files
          git add models/active/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "🤖 Auto-deploy: Update active model [$(date -u '+%Y-%m-%d %H:%M:%S UTC')]"
            git push
            echo "✅ Active model committed to repository"
          fi
        continue-on-error: true

      # ==========================================================================
      # Build and Push Docker Image
      # ==========================================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vad-mlops
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-
            type=ref,event=branch

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vad-mlops:latest
            ghcr.io/${{ github.repository_owner }}/vad-mlops:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==========================================================================
      # Create GitHub Release
      # ==========================================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: deploy-v${{ github.run_number }}
          name: Deployment v${{ github.run_number }}
          body: |
            ## 🚀 Automated Model Deployment
            
            **Deployment Details:**
            - Run Number: ${{ github.run_number }}
            - Commit: ${{ github.sha }}
            - Triggered by: ${{ github.event_name }}
            
            **Model Information:**
            - Best model selected from all feature sets
            - See `meta.json` for detailed metrics
            
            **Docker Image:**
            - `ghcr.io/${{ github.repository_owner }}/vad-mlops:latest`
            - `ghcr.io/${{ github.repository_owner }}/vad-mlops:${{ github.sha }}`
          files: |
            models/active/model.pkl
            models/active/scaler.pkl
            models/active/meta.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # ==========================================================================
      # Notify Deployment Status
      # ==========================================================================
      - name: Deployment Summary
        run: |
          echo "## 🎯 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Model Selection | ✅ Complete |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ✅ Complete |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Release | ✅ Created |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Active Model Info:" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat models/active/meta.json >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
